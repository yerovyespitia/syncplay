<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">

  <!--
    Play triangle: vertices (73, 62), (73, 98), (94, 80)
    Centroid = ((73+73+94)/3, (62+98+80)/3) = (80, 80) — exactly centered.

    Arc centers: left at (66, 80) and right at (94, 80).
    Both are 14px from canvas center (80): 80-66=14, 94-80=14 → symmetric.
    Outer arcs reach x=43 and x=117 → both 37px from canvas center → symmetric.
  -->

  <!-- Lucide play icon, scaled to match previous triangle bounds (x:65–95, y:62–98) -->
  <g transform="translate(62.5, 63.2) scale(1.4)">
    <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" fill="#8b5cf6" />
  </g>

  <!-- Right arcs: centered at tip (94, 80), sweep=1 (opens rightward) -->
  <!-- r=13: (101.5, 69.4)↔(101.5, 90.6) via (107, 80) -->
  <path d="M 101.5 69.4 A 13 13 0 0 1 101.5 90.6"  stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" />
  <!-- r=23: (107.2, 61.2)↔(107.2, 98.8) via (117, 80) -->
  <path d="M 107.2 61.2 A 23 23 0 0 1 107.2 98.8"  stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" />

  <!-- Left arcs: centered at (66, 80), sweep=0 (opens leftward) -->
  <!-- r=13: (58.5, 69.4)↔(58.5, 90.6) via (53, 80) -->
  <path d="M 58.5 69.4 A 13 13 0 0 0 58.5 90.6"   stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" />
  <!-- r=23: (52.8, 61.2)↔(52.8, 98.8) via (43, 80) -->
  <path d="M 52.8 61.2 A 23 23 0 0 0 52.8 98.8"   stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" />
</svg>
